# Atualizações de dependências (PRs semanais) e alertas de segurança.
version: 2
updates:
  - package-ecosystem: npm # funciona com o pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # SheetJS vem do tarball oficial (cdn.sheetjs.com): o pacote do npm está parado com CVEs.
      - dependency-name: xlsx
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
